name = "thailand-trip"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Every 15 minutes. The engine itself decides which sources are worth calling on each run.
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "TRIP_KV"
# Created in the Cloudflare account as "thailand-trip-TRIP_KV"
id = "13fa53eda98a4075bae6c728ddf2ef49"

[vars]
VAPID_PUBLIC_KEY = "BK9irya7D4tahwpR8dry7xJzYMth2ya_iaUbSu1MSyF-bADJPWeb-ECntORAb7Ccee5YMmbCrF9LWmZhrl8FKo0"
VAPID_CONTACT = "https://thailand-trip.yaron-shapira7.workers.dev"
# Which model runs news triage and "re-plan for me": "claude" or "openai". Each needs its own key below.
AI_PROVIDER = "claude"
CLAUDE_TRIAGE_MODEL = "claude-haiku-4-5"
CLAUDE_REPLAN_MODEL = "claude-sonnet-5-5"
OPENAI_TRIAGE_MODEL = "gpt-5.4-mini"
OPENAI_REPLAN_MODEL = "gpt-5.5"
# News shadow mode: hourly log of what GDELT and Google News return, no alerts. Read it with
# `npm run shadow:report`; set "off" once a source is chosen. SHADOW_AI = "on" adds ~2 AI calls a day.
SHADOW_NEWS = "on"
SHADOW_AI = "off"

# Secrets (set with `npx wrangler secret put NAME`, or put them in .dev.vars for local dev):
#   APP_TOKEN           shared code the app sends; the only lock until Cloudflare Access is set up
#   ACCESS_TEAM_DOMAIN  e.g. myteam.cloudflareaccess.com; with ACCESS_AUD, only signed-in allowed emails get in
#   ACCESS_AUD          the Access application's "Application Audience (AUD) Tag"
#   VAPID_PRIVATE_JWK   private key JSON from `npm run vapid`
#   ANTHROPIC_API_KEY   optional: news triage and "re-plan for me" when AI_PROVIDER = "claude"
#   OPENAI_API_KEY      optional: the same when AI_PROVIDER = "openai"
#   GOOGLE_MAPS_KEY     optional: live drive times (Routes API)
#   RAPIDAPI_KEY        optional: flight status (AeroDataBox on RapidAPI)
