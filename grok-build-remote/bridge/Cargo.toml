[package]
name = "gbr"
version = "0.1.0"
edition = "2021"
description = "Grok Build Remote bridge: lets a paired Android phone follow and steer Grok Build sessions on this Mac"
license = "Apache-2.0"
publish = false

[[bin]]
name = "gbr"
path = "src/main.rs"

# Test helper that pretends to be `grok agent stdio`. Not installed, only used by tests.
[[bin]]
name = "fake-grok"
path = "src/bin/fake_grok.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
