# Trip simulator (thailand-trip/sim): scenario days through the real worker, plus a live check
# of the real data sources that also re-records the simulator's fixtures.
name: thailand-trip simulator

on:
  pull_request:
    paths: ["thailand-trip/**", ".github/workflows/thailand-trip-sim.yml"]
  push:
    branches: [main]
    paths: ["thailand-trip/**", ".github/workflows/thailand-trip-sim.yml"]
  schedule:
    # Mondays 03:00 UTC: catches a source that changed its format before the trip does.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the fresh recordings to this branch"
        type: boolean
        default: false

defaults:
  run:
    working-directory: thailand-trip

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thailand-trip/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: thailand-trip/sim
      - run: npm run sim -- --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-reports
          path: thailand-trip/sim/reports/

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A source being down for a moment should not block a pull request; on the weekly run it fails loudly.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thailand-trip/package-lock.json
      - run: npm ci
      - id: seed
        name: Are the recordings still starter files?
        run: echo "seed=$(node -p "require('./sim/fixtures/meta.json').sources.weather.origin === 'seed'")" >> "$GITHUB_OUTPUT"
      - name: Check the real sources and record them
        run: npm run sim:live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          LIVE_FLIGHT: ${{ vars.LIVE_FLIGHT }}
      - name: Scenarios on the fresh recordings
        if: always()
        run: npm run sim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-recordings
          path: thailand-trip/sim/fixtures/
      # Commits only the first real recording on a pull request, or when asked; never on main.
      - name: Commit the recordings
        if: >-
          github.ref_name != 'main' &&
          (inputs.commit || (github.event_name == 'pull_request' && steps.seed.outputs.seed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add sim/fixtures
          git diff --cached --quiet || git commit -m "thailand-trip/sim: record real source responses"
          git push
